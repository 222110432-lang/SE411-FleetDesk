services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fleetdesk
      POSTGRES_USER: fleetdesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - inventory:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetdesk -d fleetdesk"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://database:5432/fleetdesk
      DB_USER: fleetdesk
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      database:
        condition: service_healthy
    stop_grace_period: 25s
volumes:
  inventory:
